<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floor Plans</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            font-family: Arial, sans-serif;
            overflow-x: hidden;

            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* Watermark */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-35deg);

            font-size: 4rem;
            font-weight: 700;
            color: white;
            opacity: 0.08;

            pointer-events: none;
            z-index: 9999;
            text-align: center;
            white-space: nowrap;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 30px;
            color: white;
            background: #000;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            margin-bottom: 10px;
        }

        .header p {
            color: #aaa;
        }

        /* Gallery */
        .gallery {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding: 30px;
        }

        .plan-card {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .plan-card img {
            width: 100%;
            display: block;
            pointer-events: none;
        }

        .plan-title {
            padding: 15px;
            color: white;
            font-size: 18px;
            text-align: center;
        }

        footer {
            text-align: center;
            color: #888;
            padding: 30px;
        }
    </style>
</head>

<body>

    <div class="watermark">
        CONFIDENTIAL<br>
        FOR CLIENT REVIEW ONLY
    </div>

    <div class="header">
        <h1>Floor Plans</h1>
    </div>

    <div class="gallery">

        <div class="plan-card">
            <img src="assets/concept.png" draggable="false">
            <div class="plan-title">Concept Ground Floor Plan</div>
        </div>

        <div class="plan-card">
            <img src="assets/pradeep1.png" draggable="false">
            <div class="plan-title">Ground Floor Plan</div>
        </div>

        <div class="plan-card">
            <img src="assets/pradeep2.png" draggable="false">
            <div class="plan-title">First Floor Plan</div>
        </div>

        <div class="plan-card">
            <img src="assets/pradeep3.png" draggable="false">
            <div class="plan-title">Second Floor Plan</div>
        </div>

    </div>

    <footer>
        © Confidential Architectural Drawings
    </footer>

    <script>

        // Disable right click
        document.addEventListener("contextmenu", e => {
            e.preventDefault();
        });

        // Disable common shortcuts
        document.addEventListener("keydown", function (e) {

            if (
                (e.ctrlKey && e.key === "s") ||
                (e.ctrlKey && e.key === "u") ||
                (e.ctrlKey && e.key === "p") ||
                (e.ctrlKey && e.shiftKey && e.key === "I") ||
                (e.ctrlKey && e.shiftKey && e.key === "J") ||
                (e.ctrlKey && e.shiftKey && e.key === "C") ||
                (e.key === "F12")
            ) {
                e.preventDefault();
            }

        });

    </script>

</body>

</html>
